[package]
name = "novig-mm"
description = "A reference two-sided maker for Novig v3: quotes around mid with inventory skew, reprices on moves, stands down on GOLIVE, and accounts for maker credits. Paper mode simulates queue-aware fills from the live book; live mode trades through the API."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mm-bot"
path = "src/main.rs"

[dependencies]
novig-v3.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
